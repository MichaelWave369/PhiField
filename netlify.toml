[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PHI_FIELD_BASE = "/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# No domain or DNS credentials are stored in this repository.
# Add phi-field.com and www.phi-field.com through Netlify Domain management.
