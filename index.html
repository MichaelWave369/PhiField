<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060e17" />
    <meta name="description" content="Φ-FIELD is the sovereign creative, research, and engineering home of the Enter the Field ecosystem. Explore open worlds, tools, and the public Commons Gateway." />
    <meta property="og:title" content="Φ-FIELD | A Sovereign Creative Universe" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <style>
      .boot-fallback{min-height:85vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
        padding:35px;text-align:center;background:#070f18;color:#eef9f5;font:16px/1.7 system-ui,sans-serif}
      .boot-fallback h1{font-size:clamp(32px,7vw,58px);letter-spacing:.12em;margin:0}
      .boot-fallback p{margin:0;color:#add9d3}
      .boot-fallback .boot-emblem{font:110px/1 Georgia,serif;color:#8df5d9}
      .boot-fallback .boot-recovery{max-width:540px;font-size:13px;color:#a7b9c1}
      .boot-fallback a{color:#8df5d9;text-decoration:underline}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-fallback" role="status" aria-live="polite">
        <span class="boot-emblem" aria-hidden="true">Φ</span>
        <h1>Φ-FIELD</h1>
        <p>Loading the field…</p>
        <p class="boot-recovery">The application did not start if this message remains.
          <a href="https://github.com/MichaelWave369/PhiField/actions">Check deployment status</a>
          or reload the page.</p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
